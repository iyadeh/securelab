services:
    postgres:
        image: postgres:17.11-alpine3.24
        environment:
            POSTGRES_DB: ${DB_DATABASE:-securelab}
            POSTGRES_USER: ${DB_USERNAME:-securelab}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-securelab}
        ports:
            - '127.0.0.1:${DB_PORT:-5432}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s

volumes:
    postgres_data:
